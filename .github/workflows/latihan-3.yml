name: Latihan 3
# Belajar: memakai file dari folder assets/ repo sendiri, lalu menyimpan
# hasilnya sebagai artifact yang bisa didownload dari halaman run Actions.
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install update
        run: sudo apt update -y

      - name: Install apache
        run: sudo apt install apache2 -y

      - name: Ganti landing page default dengan file dari assets/latihan-3
        run: sudo cp latihan-git-action-dan-runner/assets/latihan-3/index.html /var/www/html/index.html

      - name: Tes landing page hasil ganti
        run: sudo systemctl start apache2 && curl localhost

      - name: Simpan hasil sebagai artifact (bukti tanpa perlu VM publik)
        uses: actions/upload-artifact@v4
        with:
          name: hasil-latihan-3
          path: assets/latihan-3/index.html
