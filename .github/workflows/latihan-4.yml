name: Latihan 4
# Belajar: input manual saat menekan "Run workflow", dan cara memakai Secrets
# (di sini secret contoh saja, bukan data VM asli). Landing page memakai
# gambar dari assets/latihan-4 supaya tampilan tidak kosong.
on:
  workflow_dispatch:
    inputs:
      nama_siswa:
        description: 'masukan nama anda'
        required: true
        default: 'Awan Nathaniel P'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Tampilkan input & secret contoh (nilai secret otomatis disensor di log)
        env:
          CONTOH_SECRET: ${{ secrets.CONTOH_SECRET }}
        run: |
          echo "Nama siswa yang mengisi input: ${{ github.event.inputs.nama_siswa }}"
          echo "Panjang isi CONTOH_SECRET (bukan isinya): ${#CONTOH_SECRET} karakter"

      - name: Install update & nginx
        run: |
          sudo apt update -y
          sudo apt install nginx -y

      - name: Salin halaman & gambar dari assets/latihan-4
        run: |
          sudo cp latihan-git-action-dan-runner/assets/latihan-4/index.html /var/www/html/index.html
          sudo cp latihan-git-action-dan-runner/asset/latihan-4/banner.svg /var/www/html/banner.svg
          sudo sed -i "s/{{NAMA}}/${{ github.event.inputs.nama_siswa }}/" /var/www/html/index.html

      - name: Jalankan nginx
        run: sudo systemctl start nginx

      - name: Uji coba tools yang nanti dipakai untuk remote VM (dry-run, belum konek)
        run: |
          sudo apt install -y sshpass
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb
          cloudflared --version
          sshpass -V

      - name: Publikasikan lewat Cloudflare Quick Tunnel
        run: sudo cloudflared tunnel --url http://localhost:80
